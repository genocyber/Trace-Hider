<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Trace Hider - Registro Privado</title>
  <style>
    :root {
      /* Tema Oscuro Táctico / Agente Secreto */
      --bg-color: #0f1115;
      --card-bg: #181b20;
      --item-bg: #111318;
      --text-main: #e2e8f0;
      --text-muted: #8a94a6;
      --accent: #ff7700;
      --accent-hover: #ff902a;
      --danger: #ef4444;
      --border: #2a2e37;
      --input-bg: #0d0e12;
      --form-bg: #14171d;
      --badge-bg: #271d15;
    }

    body.light-theme {
      /* Tema Claro Táctico */
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --item-bg: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent: #ea580c;
      --accent-hover: #c2410c;
      --danger: #dc2626;
      --border: #e2e8f0;
      --input-bg: #f1f5f9;
      --form-bg: #fff7ed;
      --badge-bg: #ffedd5;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem;
      max-width: 850px;
      margin: 0 auto;
      transition: background-color 0.3s, color 0.3s;
    }

    /* PANTALLA DE BLOQUEO */
    #lock-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .lock-card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(255, 119, 0, 0.15);
      border: 1px solid var(--accent);
      text-align: center;
      width: 320px;
    }

    .lock-card h3 { 
      margin-top: 0; 
      color: var(--accent); 
      letter-spacing: 0.05em; 
      text-transform: uppercase;
    }

    .lock-card input {
      width: 100%;
      padding: 0.7rem;
      margin: 1rem 0;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text-main);
      box-sizing: border-box;
      text-align: center;
      font-size: 1.1rem;
    }

    .lock-card input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.85rem;
      display: none;
      margin-top: -0.5rem;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    /* PANEL PRINCIPAL */
    .card {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    h2 { 
      margin: 0; 
      color: var(--accent); 
      font-size: 1.5rem; 
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .header-btns { display: flex; gap: 8px; }

    .theme-toggle-btn, .settings-btn {
      background: var(--border);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .theme-toggle-btn:hover, .settings-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* SECCIÓN CONFIGURACIÓN CONTRASEÑA */
    .settings-panel {
      background: var(--form-bg);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.2rem;
      border: 1px solid var(--accent);
      display: none;
    }

    .settings-panel h4 { 
      margin: 0 0 0.8rem 0; 
      color: var(--accent); 
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    .settings-form { display: flex; gap: 10px; align-items: center; }

    .settings-form input { 
      flex: 1; 
      padding: 0.6rem; 
      border-radius: 6px; 
      border: 1px solid var(--border); 
      background: var(--input-bg); 
      color: var(--text-main); 
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 1.2rem;
    }

    input[type="text"] {
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 0.95rem;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .search-input-flex { flex: 1; }

    select {
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text-main);
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    button.clear-btn { background: var(--danger); color: #ffffff; }
    button.action-btn { background: var(--accent); color: #000000; font-weight: 700; }
    button.action-btn:hover { background: var(--accent-hover); }
    button.load-more-btn { background: var(--accent); color: #000000; width: 100%; margin-top: 1rem; font-weight: 700; }
    button:hover { opacity: 0.9; }

    .date-group { margin-top: 1.5rem; }

    .date-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3rem;
      margin-bottom: 0.8rem;
    }

    .history-list { list-style: none; padding: 0; margin: 0; }

    .history-item {
      background: var(--item-bg);
      padding: 0.8rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      border: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: border-color 0.2s;
    }

    .history-item:hover {
      border-color: rgba(255, 119, 0, 0.4);
    }

    .item-thumbnail {
      width: 70px;
      height: 45px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--card-bg);
    }

    .no-thumbnail {
      width: 70px;
      height: 45px;
      border-radius: 4px;
      border: 1px dashed var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--card-bg);
    }

    .item-content { flex: 1; min-width: 0; }

    .item-title {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .item-title:hover { 
      color: var(--accent);
      text-decoration: underline; 
    }

    .item-url {
      color: var(--text-muted);
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .search-badge {
      display: inline-block;
      background: var(--badge-bg);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
      border: 1px solid rgba(255, 119, 0, 0.3);
    }

    .form-data-container {
      margin-top: 6px;
      padding: 6px 10px;
      background: var(--form-bg);
      border-radius: 6px;
      border-left: 3px solid var(--accent);
      font-size: 0.78rem;
    }

    .form-data-title { font-weight: bold; color: var(--accent); margin-bottom: 4px; }
    .form-data-item { color: var(--text-main); word-break: break-word; margin-bottom: 2px; }
    .form-data-key { color: var(--text-muted); font-weight: 600; }
    .item-meta { color: var(--text-muted); font-size: 0.75rem; margin-top: 4px; }
    .item-actions { display: flex; gap: 6px; }

    .icon-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .icon-btn:hover { 
      background: var(--border); 
      color: var(--accent);
      border-color: var(--accent);
    }

    .empty-state { text-align: center; color: var(--text-muted); padding: 2.5rem 0; }
  </style>
</head>
<body>

  <!-- PANTALLA DE BLOQUEO -->
  <div id="lock-screen">
    <div class="lock-card">
      <h3>🔒 Acceso Restringido</h3>
      <p style="font-size:0.85rem; color: var(--text-muted);">Introduce la clave de acceso para acceder al registro</p>
      <input type="password" id="pass-input" placeholder="Clave de acceso" autofocus>
      <div id="pass-error" class="error-msg">Clave incorrecta</div>
      <button id="unlock-btn" class="action-btn" style="width:100%;">Acceder</button>
    </div>
  </div>

  <!-- PANEL PRINCIPAL -->
  <div class="card">
    <div class="header">
      <h2>🕵️ TRACE HIDER</h2>
      <div class="header-btns">
        <button id="toggle-settings-btn" class="settings-btn">⚙️ Clave</button>
        <button id="theme-btn" class="theme-toggle-btn">🌙 Modo Oscuro</button>
        <button id="clear-btn" class="clear-btn">Vaciar Todo</button>
      </div>
    </div>

    <!-- PANEL DE CONFIGURACIÓN DE CLAVE -->
    <div id="settings-panel" class="settings-panel">
      <h4>Cambiar Clave de Acceso</h4>
      <div class="settings-form">
        <input type="password" id="new-pass" placeholder="Nueva clave">
        <button id="save-pass-btn" class="action-btn">Guardar</button>
      </div>
    </div>

    <div class="controls">
      <input type="text" id="search-input" class="search-input-flex" placeholder="Buscar por título, URL, búsqueda o datos introducidos...">
      <select id="type-filter">
        <option value="all">Todas las páginas</option>
        <option value="searches">Solo búsquedas</option>
        <option value="forms">Con formularios/datos</option>
      </select>
    </div>

    <div id="history-container"></div>
    <button id="load-more-btn" class="load-more-btn" style="display: none;">Cargar más registros</button>
  </div>

  <script src="options.js"></script>
</body>
</html>
